# --- usual times and durations, rules --------------------------------------------------

- id: creation-18
  say: "schedule drinks on saturday at 7 pm"
  seed: {defaults: [[drinks, null, 90]]}
  call: {tool: add_event, title: drinks, date: "{sat}", time: "19:00"}
  added: [[drinks, "{sat}T19:00", "{sat}T20:30"]]

- id: creation-19
  say: "add yoga tomorrow"
  seed: {defaults: [[yoga, "19:00", 45]]}
  call: {tool: add_event, title: yoga, date: "{tomorrow}"}
  added: [[yoga, "{tomorrow}T19:00", "{tomorrow}T19:45"]]

- id: creation-20
  say: "add the shower"
  seed:
    events: [[gym, "{today}T17:00", "{today}T18:00"]]
    rules: [[shower, gym, after, 0]]
    defaults: [[shower, null, 15]]
  call: {tool: add_event, title: shower}
  added: [[shower, "{today}T18:00", "{today}T18:15"]]

- id: creation-21
  # "after X, N minutes" (without "for") is read as an offset, not a duration: with no known
  # duration for "shower", the action stays pending and the duration is asked, as in creation-24.
  say: "add the shower after the gym, 20 minutes"
  seed: {events: [[gym, "{today}T17:00", "{today}T18:00"]]}
  call: {tool: add_event_relative, title: shower, anchor_description: gym, position: after, offset_minutes: 20}
  kind: missing_field:duration_minutes
  reply_has: ["How long does"]

