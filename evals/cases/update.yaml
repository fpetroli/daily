# --- cascade and conflicts -----------------------------------------------------------------

- id: update-17
  say: "move the gym by half an hour"
  seed:
    events:
      - [gym, "{today}T18:00", "{today}T19:00"]
      - {title: shower, start: "{today}T19:00", end: "{today}T19:15", parent: gym}
  call: {tool: update_event, event_description: gym, shift_minutes: 30}
  moved: [[[gym, "{today}T18:00", "{today}T19:00"], [gym, "{today}T18:30", "{today}T19:30"]]]
  reply_has: ['Shall I also move "shower" from 19:30 to 19:45?']
  quick_replies: ["Yes", "No"]

