# Moving, lengthening, renaming events already in the schedule. Today Monday, September 21,
# 2026, 15:30.

- id: update-01
  say: "move the meeting by half an hour"
  seed: {events: [[meeting, "{today}T16:00", "{today}T17:00"]]}
  call: {tool: update_event, event_description: meeting, shift_minutes: 30}
  moved: [[[meeting, "{today}T16:00", "{today}T17:00"], [meeting, "{today}T16:30", "{today}T17:30"]]]
  kind: event_updated

- id: update-02
  say: "bring the meeting forward by 15 minutes"
  seed: {events: [[meeting, "{today}T16:00", "{today}T17:00"]]}
  call: {tool: update_event, event_description: meeting, shift_minutes: -15}
  moved: [[[meeting, "{today}T16:00", "{today}T17:00"], [meeting, "{today}T15:45", "{today}T16:45"]]]

- id: update-03
  say: "move lunch to 13:30"
