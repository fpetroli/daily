    events:
      - [meeting, "{today}T15:00", "{today}T16:00"]
      - [meeting, "{today}T17:00", "{today}T18:00"]
  call: {tool: update_event, event_description: meeting, event_time: "15:00", new_time: "14:00"}
  moved: [[[meeting, "{today}T15:00", "{today}T16:00"], [meeting, "{today}T14:00", "{today}T15:00"]]]

- id: update-09
