  moved: [[[gym, "{today}T18:00", "{today}T19:00"], [gym, "{today}T18:00", "{today}T19:30"]]]

- id: update-06
  say: "shorten the meeting by 15 minutes"
  split: holdout
  seed: {events: [[meeting, "{today}T16:00", "{today}T17:00"]]}
  call: {tool: update_event, event_description: meeting, extend_minutes: -15}
  moved: [[[meeting, "{today}T16:00", "{today}T17:00"], [meeting, "{today}T16:00", "{today}T16:45"]]]

- id: update-07
  say: "rename the call with Marco to call with Marco and Luca"
  seed: {events: [[call with Marco, "{today}T17:00", "{today}T17:30"]]}
  call: {tool: update_event, event_description: call with Marco, new_title: call with Marco and Luca}
  moved: [[[call with Marco, "{today}T17:00", "{today}T17:30"], [call with Marco and Luca, "{today}T17:00", "{today}T17:30"]]]

- id: update-08
  say: "bring the 3 pm meeting forward to 2 pm"
