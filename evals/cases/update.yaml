  call: {tool: update_event, event_description: lunch, new_time: "13:30"}
  moved: [[[lunch, "{today}T13:00", "{today}T14:00"], [lunch, "{today}T13:30", "{today}T14:30"]]]

- id: update-04
  say: "move tomorrow's gym to 7 pm"
  seed: {events: [[gym, "{tomorrow}T18:00", "{tomorrow}T19:00"]]}
  call: {tool: update_event, event_description: gym, event_date: "{tomorrow}", new_time: "19:00"}
  moved: [[[gym, "{tomorrow}T18:00", "{tomorrow}T19:00"], [gym, "{tomorrow}T19:00", "{tomorrow}T20:00"]]]

- id: update-05
  say: "extend the gym by 30 minutes"
  seed: {events: [[gym, "{today}T18:00", "{today}T19:00"]]}
