# From the reports of real use (2026-09 and 2026-10): the recent conversation is about
# something else and the new message is a request of its own. The model must not copy the
# previous action, title or minutes.
- id: multiturn-26
  turns:
    - {say: "after the gym I always have breakfast", call: {tool: add_event_rule, trigger_title: breakfast, related_title: gym, position: after}, kind: add_event_rule_success}
    - {say: "add the gym tomorrow at 7 for an hour and a half", call: {tool: add_event, title: gym, date: "{tomorrow}", time: "07:00", duration_minutes: 90}, kind: event_created}
  rules_added: [[breakfast, gym]]
  added: [[gym, "{tomorrow}T07:00", "{tomorrow}T08:30"]]

