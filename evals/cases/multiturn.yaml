# From the reports of real use (2026-10): a rule in the history does not turn the next
# "add X after Y" into a rule, and a removal in the history does not turn a new rule into a
# removal.
- id: multiturn-34
  seed:
    events: [[gym, "{today}T18:30", "{today}T20:00"]]
    defaults: [[shower, null, 30]]
  turns:
    - {say: "the shower always goes after the gym", call: {tool: add_event_rule, trigger_title: shower, related_title: gym, position: after}, kind: add_event_rule_success}
    - {say: "add the shower after the gym", call: {tool: add_event_relative, title: shower, anchor_description: gym, position: after}, kind: event_created}
  rules_added: [[shower, gym]]
  added: [[shower, "{today}T20:00", "{today}T20:30"]]

- id: multiturn-35
  seed: {rules: [[breakfast, wake-up, before, 0]]}
  turns:
    - {say: "remove the rule where breakfast is right before wake-up", call: {tool: remove_event_rule, trigger_title: breakfast, related_title: wake-up}, kind: remove_event_rule_success}
    - {say: "usually breakfast is after wake-up", call: {tool: add_event_rule, trigger_title: breakfast, related_title: wake-up, position: after}, kind: add_event_rule_success}
  # The same pair as in the seed, now "after": the rules at the end are the seed's again.
